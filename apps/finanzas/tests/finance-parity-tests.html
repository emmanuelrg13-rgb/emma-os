<!doctype html>
<!-- Emma OS v1.8.0 · Finanzas M4 paridad · pruebas locales no destructivas -->
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance M4 parity tests</title>
<link rel="stylesheet" href="../../../emma-theme.css">
<style>
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui;background:var(--emma-bg);color:var(--emma-text)}.wrap{width:min(100% - 28px,980px);margin:0 auto;padding:28px 0}.hero,.row{border:1px solid var(--emma-line);border-radius:24px;background:rgba(18,26,47,.92);padding:18px;margin:10px 0}.btn{border:1px solid var(--emma-line);background:rgba(23,34,61,.78);color:var(--emma-text);border-radius:999px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--emma-yellow),var(--emma-green));color:#06111f;border:0}.ok{border-color:rgba(52,211,153,.45)}.err{border-color:rgba(248,113,113,.55)}small,p{color:var(--emma-muted)}pre{white-space:pre-wrap;overflow:auto;background:rgba(15,23,42,.75);border:1px solid var(--emma-line);border-radius:18px;padding:14px}
</style>
<script src="../../../emma-shell.js" data-base="../../../" data-current="finanzas" data-version="v1.8.0" defer></script>
</head>
<body class="emma-module emma-module-finanzas"><main class="wrap">
<section class="hero"><small>M4 · pruebas locales</small><h1>Finance Parity tests</h1><p>Pruebas no destructivas del generador de reporte M4. No leen ni escriben Google Sheets.</p><button class="btn primary" id="run">Ejecutar pruebas</button> <a class="btn" href="../">Volver a Finanzas</a></section>
<section id="out"></section><pre id="dump">—</pre>
</main>
<script type="module">
import { createMemoryFinanceService } from '../service/finance-service.js';
import { settings, items, payments } from './finance-fixtures.js';
import { buildParityReport } from '../ui/finance-parity-ui.js';
const out=document.getElementById('out'), dump=document.getElementById('dump');
function row(name, ok, detail=''){ return `<div class="row ${ok?'ok':'err'}"><strong>${ok?'✓':'✕'} ${name}</strong><br><small>${detail || (ok?'OK':'FALLÓ')}</small></div>`; }
async function run(){
  const service=createMemoryFinanceService({settings,items,payments});
  const normalized=await service.getAppState();
  // En repositorio de memoria, sourceState y coreState provienen del mismo núcleo; debería aprobar checks no negociables.
  const report=buildParityReport(normalized);
  const tests=[];
  tests.push(['Reporte se genera', report && report.schemaVersion==='finance-parity-report-v1']);
  tests.push(['Tiene checks', report.checks.length>10, `${report.checks.length} checks`]);
  tests.push(['No negociables aprobados', report.summary.mustPassed===report.summary.mustTotal, `${report.summary.mustPassed}/${report.summary.mustTotal}`]);
  tests.push(['Estado no bloqueado', report.summary.status!=='bloqueado', report.summary.status]);
  tests.push(['Verifica IDs de ítems', report.checks.some(c=>c.id==='no-duplicate-item-ids' && c.ok)]);
  tests.push(['Verifica UUIDs de pagos', report.checks.some(c=>c.id==='no-duplicate-payment-ids' && c.ok)]);
  tests.push(['Verifica saldos por ítem', report.checks.some(c=>String(c.id).includes('-balance') && c.ok)]);
  tests.push(['Verifica pagos anulados', report.checks.some(c=>c.id==='voided-preserved' && c.ok)]);
  tests.push(['Verifica gate inversiones', report.checks.some(c=>c.id==='gate-unlocked' && c.ok)]);
  out.innerHTML=tests.map(t=>row(t[0], !!t[1], t[2]||'')).join('');
  dump.textContent=JSON.stringify(report.summary,null,2);
}
document.getElementById('run').addEventListener('click', run);run();
</script></body></html>
